services:

  web:
    build:
      context: ../
      dockerfile: docker/http_server.dockerfile
    ports:
      - "80:80"
      - "8080:80"
    environment:
      - MULTI_INTERNAL_HOST=multi
    volumes:
      - ../clients:/pr2/http_server/clients:ro
      - ../../levels:/pr2/http_server/levels
      - ../../replays:/pr2/http_server/replays
      - shared-data:/pr2/shared
    depends_on:
      - mysql

  multi:
    build:
      context: ../
      dockerfile: docker/multi_server.dockerfile
    ports:
      - "9160:9160"
    # depends_on:
    #   - liquibase
    restart: always
    volumes:
      - shared-data:/pr2/shared
      - ../../levels:/pr2/http_server/levels:ro
      - ../../replays:/pr2/http_server/replays

  policy:
    build:
      context: ../
      dockerfile: docker/policy_server.dockerfile
    ports:
      - "843:843"

  mysql:
    image: mysql
    environment:
      MYSQL_DATABASE: pr2
      MYSQL_USER: pr2
      MYSQL_PASSWORD: pr2
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

  liquibase:
    build:
      context: ../
      dockerfile: docker/liquibase.dockerfile
    command: update
    environment:
      LIQUIBASE_URL: jdbc:mysql://mysql/pr2
      LIQUIBASE_USERNAME: root
      LIQUIBASE_PASSWORD: root
      LIQUIBASE_CHANGELOG: /liquibase/changelog.yaml
    volumes:
      - ../liquibase:/liquibase
      - ./:/scripts
    depends_on:
      - mysql
    restart: 'no'

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    depends_on:
      - mysql

volumes:
  mysql-data:
  shared-data:
